name: Validate changes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede PR validation only; older main reruns must not cancel newer runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ['22.12.0', '24.x']
    env:
      NPM_CONFIG_ENGINE_STRICT: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/markdown-preview/package-lock.json
            plugins/markdown-preview/runtime/renderer/package-lock.json
      - name: Install plugin dependencies
        run: |
          npm ci --include=dev --ignore-scripts
          npm ci --prefix plugins/markdown-preview --include=dev --include=optional --ignore-scripts
          npm ci --prefix plugins/markdown-preview/runtime/renderer --include=optional --ignore-scripts
      - name: Install browser
        run: npx --prefix plugins/markdown-preview playwright install --with-deps chromium
      - name: Validate source
        run: |
          npm test --prefix plugins/markdown-preview
          npm run test:browser --prefix plugins/markdown-preview
          npm run test:live --prefix plugins/markdown-preview
          npm run test:open-browser --prefix plugins/markdown-preview
          node --test tests/test-node-version.cjs
          node --test tests/test-installer.cjs
          node tests/test-release-package.cjs
          node tests/test-remote-installer.cjs
          node --test tests/test-workflow-concurrency.cjs
          node --test tests/test-marketplace-package.cjs tests/test-marketplace-publisher.cjs tests/test-marketplace-unpack.cjs
          git diff --check
      - name: Build portable distribution
        if: matrix.node-version == '22.12.0'
        run: |
          node scripts/package-marketplace.cjs --source-commit "${{ github.sha }}"
      - name: Upload portable distribution
        if: matrix.node-version == '22.12.0'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-preview-portable-distribution
          if-no-files-found: error
          path: |
            dist/markdown-preview-marketplace.tgz
            dist/marketplace.SHA256SUMS

  verify-distribution:
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      NPM_CONFIG_ENGINE_STRICT: 'true'
      MARKDOWN_PREVIEW_REQUIRE_CODEX: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
      - name: Install validation dependencies
        run: |
          npm ci --include=dev --ignore-scripts
          npm ci --prefix plugins/markdown-preview --ignore-scripts
          npm install --prefix "${{ runner.temp }}/markdown-preview-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.160.0
      - uses: actions/download-artifact@v4
        with:
          name: markdown-preview-portable-distribution
          path: dist
      - name: Verify PowerShell installer argument forwarding
        if: runner.os == 'Windows'
        env:
          MARKDOWN_PREVIEW_REQUIRE_PWSH: '1'
        run: node --test tests/test-remote-installer-powershell.cjs
      - name: Verify and unpack the shared distribution
        run: node scripts/unpack-marketplace.cjs "${{ github.sha }}"
      - name: Install and start the final Codex plugin cache
        env:
          MARKDOWN_PREVIEW_TEST_CODEX: ${{ runner.temp }}/markdown-preview-codex/node_modules/@openai/codex/bin/codex.js
        run: node --test tests/test-marketplace-install.cjs

  publish-marketplace:
    needs: [validate, verify-distribution]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: markdown-preview-marketplace-publish
      cancel-in-progress: false
      # Keep pending publishers too: the default single slot replaces them.
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
      - name: Install archive tooling
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: markdown-preview-portable-distribution
          path: dist
      - name: Verify and unpack the validated distribution
        run: node scripts/unpack-marketplace.cjs "${{ github.sha }}"
      - name: Publish the validated distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # The publisher uses a separate Git repository, so configure the
          # runner's credential helper rather than relying on checkout credentials.
          gh auth setup-git
          node scripts/publish-marketplace.cjs \
            --source dist/marketplace \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            --ref codex/marketplace \
            --expected-source-commit "$GITHUB_SHA" \
            --source-ref main \
            --publish
