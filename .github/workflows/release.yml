name: Validate release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_CONFIG_ENGINE_STRICT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/markdown-preview/package-lock.json
            plugins/markdown-preview/runtime/renderer/package-lock.json
      - name: Install plugin dependencies
        run: |
          npm ci --include=dev --ignore-scripts
          npm ci --prefix plugins/markdown-preview --include=dev --include=optional --ignore-scripts
          npm ci --prefix plugins/markdown-preview/runtime/renderer --include=optional --ignore-scripts
      - name: Install browser
        run: npx --prefix plugins/markdown-preview playwright install --with-deps chromium
      - name: Validate source
        run: |
          npm test --prefix plugins/markdown-preview
          npm run test:browser --prefix plugins/markdown-preview
          npm run test:live --prefix plugins/markdown-preview
          npm run test:open-browser --prefix plugins/markdown-preview
          node --test tests/test-node-version.cjs
          node --test tests/test-installer.cjs
          node tests/test-release-package.cjs
          node tests/test-remote-installer.cjs
          node --test tests/test-marketplace-package.cjs tests/test-marketplace-publisher.cjs
          git diff --check
      - name: Build release package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            task_release_version="$GITHUB_REF_NAME"
          else
            task_release_version="$(node -p "require('./plugins/markdown-preview/plugin.json').version")"
          fi
          node scripts/package-release.cjs --version "$task_release_version"
          node scripts/package-marketplace.cjs --source-commit "$GITHUB_SHA"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markdown-preview-${{ github.ref_name }}
          path: |
            dist/markdown-preview-*.tar.gz
            dist/markdown-preview-*.zip
            dist/SHA256SUMS
            dist/markdown-preview-marketplace.tgz
            dist/marketplace.SHA256SUMS
