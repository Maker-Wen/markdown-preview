<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown Preview</title>
    <style>
      /* BUNDLED_STYLES */

      :root {
        color-scheme: light;
        --paper: var(--color-background-primary, #fff);
        --side: var(--color-background-secondary, #f5f5f5);
        --ink: var(--color-text-primary, #292929);
        --muted: var(--color-text-secondary, #62666c);
        --accent: var(--color-text-info, #315fbd);
        --error: var(--color-text-danger, #b84036);
        --line: var(--color-border-primary, #dddfe3);
        --reader-font: var(--font-sans, system-ui),system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
        --mono-font: var(--font-mono, ui-monospace),ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
        font: 14px/1.6 var(--reader-font);
      }

      :root[data-theme=dark] {
        color-scheme: dark;
        --paper: var(--color-background-primary, #191919);
        --side: var(--color-background-secondary, #242424);
        --ink: var(--color-text-primary, #dedede);
        --muted: var(--color-text-secondary, #aaaeb5);
        --accent: var(--color-text-info, #a5bfff);
        --error: var(--color-text-danger, #f6a99b);
        --line: var(--color-border-primary, #383b40);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
      }

      body {
        display: grid;
        grid-template-rows: auto minmax(0,1fr);
        overflow: hidden;
      }

      body > header {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        align-items: center;
        min-width: 0;
        gap: 8px;
        padding: 2px 12px;
        border-bottom: 1px solid var(--line);
      }

      body > header > #name {
        flex: 1 1 auto;
        min-width: 0;
        max-width: 100%;
        font-size: 13px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      :root[data-surface=embedded] body > header > #name {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      body > header > .reader-actions {
        display: flex;
        flex: 0 1 auto;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        max-width: 100%;
      }

      body > header > .reader-actions > button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        flex-shrink: 0;
        padding: 0 10px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        line-height: 1.2;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease;
      }

      body > header > .reader-actions > button:hover,
      body > header > .reader-actions > button[aria-pressed=true],
      body > header > .reader-actions > button[aria-expanded=true] {
        background: var(--side);
        color: var(--ink);
      }

      body > header > .reader-actions > button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      body > header > .reader-actions > button:disabled {
        opacity: .55;
        cursor: default;
      }

      body > header > .reader-actions > button[hidden] {
        display: none;
      }

      .reader {
        display: grid;
        grid-template-columns: 200px minmax(0,1fr);
        min-height: 0;
      }

      .reader[data-toc=hidden] {
        grid-template-columns: minmax(0,1fr);
      }

      .reader[data-toc=hidden] > aside {
        display: none;
      }

      aside {
        min-width: 0;
        overflow: auto;
        padding: 16px 14px;
        border-right: 1px solid var(--line);
        background: var(--paper);
        font-size: 12px;
      }

      aside strong {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      body > .reader > aside > #toc {
        margin-top: 10px;
      }

      body > .reader > aside > #toc a {
        color: var(--muted);
        padding-top: 5px;
        padding-right: 4px;
        padding-bottom: 5px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        text-decoration: none;
      }

      body > .reader > aside > #toc a:hover {
        color: var(--accent);
      }

      main {
        min-width: 0;
        overflow: auto;
        scroll-behavior: smooth;
        container: reader-pane / inline-size;
      }

      article#content {
        max-width: 820px;
        margin: 0 auto;
        padding: 20px 24px 72px;
        font: 16px/1.75 var(--reader-font);
        overflow-wrap: anywhere;
      }

      article#content:empty {
        display: none;
      }

      article#content h1,
      article#content h2,
      article#content h3,
      article#content h4,
      article#content h5,
      article#content h6 {
        color: var(--ink);
        font-family: inherit;
        font-weight: 650;
        line-height: 1.4;
        margin: 1.5em 0 .65em;
        scroll-margin-top: 20px;
      }

      article#content h1 {
        font-size: clamp(28px,3.5cqi,32px);
        letter-spacing: -.015em;
      }

      article#content h2 {
        font-size: 22px;
      }

      article#content h3 {
        font-size: 18px;
      }

      article#content h4 {
        font-size: 16px;
      }

      article#content h5,
      article#content h6 {
        font-size: 14px;
      }

      article#content h6 {
        color: var(--muted);
      }

      article#content > :first-child {
        margin-top: 0;
      }

      article#content p,
      article#content ul,
      article#content ol {
        margin: 0 0 1em;
      }

      article#content ul,
      article#content ol {
        padding-left: 1.6em;
      }

      article#content li + li {
        margin-top: .18em;
      }

      article#content li > ul,
      article#content li > ol {
        margin-top: .2em;
        margin-bottom: 0;
      }

      article#content a {
        color: var(--accent);
        text-underline-offset: .18em;
      }

      article#content img {
        max-width: 100%;
      }

      article#content img:not([height]) {
        height: auto;
      }

      article#content hr {
        height: 0;
        margin: 1.6em 0;
        border: 0;
        border-top: 1px solid var(--line);
      }

      article#content blockquote {
        margin: 1.1em 0;
        padding: 0 16px;
        border-left: 3px solid var(--line);
        color: var(--muted);
        font: inherit;
      }

      article#content blockquote > :last-child {
        margin-bottom: 0;
      }

      article#content input[type=checkbox] {
        accent-color: var(--accent);
      }

      article#content table {
        display: block;
        max-width: 100%;
        margin: 1.1em 0;
        overflow: auto;
        border-collapse: collapse;
        font-size: 14px;
        line-height: 1.6;
        overflow-wrap: normal;
      }

      article#content td,
      article#content th {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }

      article#content th {
        background: var(--side);
        font-weight: 600;
      }

      article#content th a {
        color: inherit;
      }

      article#content code {
        padding: .15em .35em;
        border-radius: 3px;
        background: var(--side);
        color: inherit;
        font: 14px/1.6 var(--mono-font);
      }

      article#content pre,
      article#content pre[class*=language-] {
        max-width: 100%;
        margin: 1.1em 0;
        padding: 14px 16px;
        overflow: auto;
        border: 0;
        border-radius: 6px;
        background: var(--side);
        color: var(--ink);
        font: 14px/1.65 var(--mono-font);
        tab-size: 4;
        text-shadow: none;
      }

      article#content code[class*=language-] {
        background: var(--side);
        color: var(--ink);
        text-shadow: none;
      }

      article#content pre code {
        padding: 0;
        white-space: pre;
        background: none;
        color: inherit;
        font-size: inherit;
        line-height: inherit;
        text-shadow: none;
      }

      article#content pre code[class*=language-] {
        background: none;
      }

      article#content pre[data-line] {
        padding: 1em 0 1em 3em;
      }

      article#content pre .token.comment,
      article#content pre .token.blockquote,
      article#content pre .token.prolog,
      article#content pre .token.doctype {
        color: var(--muted);
      }

      article#content pre .token.atrule,
      article#content pre .token.boolean,
      article#content pre .token.constant,
      article#content pre .token.number,
      article#content pre .token.property,
      article#content pre .token.symbol {
        color: #096f96;
      }

      article#content pre .token.tag,
      article#content pre .token.selector {
        color: #34743a;
      }

      :root[data-theme=dark] article#content pre .token {
        background: none;
        color: var(--ink);
        text-shadow: none;
      }

      :root[data-theme=dark] article#content pre .token.comment,
      :root[data-theme=dark] article#content pre .token.blockquote,
      :root[data-theme=dark] article#content pre .token.prolog,
      :root[data-theme=dark] article#content pre .token.doctype {
        color: var(--muted);
      }

      :root[data-theme=dark] article#content pre .token.keyword,
      :root[data-theme=dark] article#content pre .token.builtin {
        color: #c4a5ff;
      }

      :root[data-theme=dark] article#content pre .token.string,
      :root[data-theme=dark] article#content pre .token.attr-value,
      :root[data-theme=dark] article#content pre .token.selector,
      :root[data-theme=dark] article#content pre .token.tag {
        color: #8ed7b4;
      }

      :root[data-theme=dark] article#content pre .token.function,
      :root[data-theme=dark] article#content pre .token.class-name,
      :root[data-theme=dark] article#content pre .token.property {
        color: #a5c9ff;
      }

      :root[data-theme=dark] article#content pre .token.number,
      :root[data-theme=dark] article#content pre .token.boolean,
      :root[data-theme=dark] article#content pre .token.constant,
      :root[data-theme=dark] article#content pre .token.symbol {
        color: #edbb91;
      }

      article#content .mermaid {
        max-width: 100%;
        padding: 12px 0;
        overflow: auto;
        text-align: center;
      }

      article#content .mermaid svg {
        max-width: 100%;
        height: auto;
      }

      article#content .katex-display {
        padding: 6px 0;
        overflow: auto hidden;
      }

      body > .reader > main > pre#source {
        max-width: 980px;
        margin: 0 auto;
        padding: 20px 24px 72px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        font: 14px/1.8 var(--mono-font);
      }

      body > .reader > main > pre#source > span {
        display: block;
        min-height: 1.8em;
      }

      body > .reader > main > p#error,
      body > .reader > main > p#status {
        margin: 12px 24px;
        color: var(--error);
        white-space: pre-wrap;
      }

      body > .reader > main > p#status {
        font-size: 13px;
      }

      body > .reader > main > div#detail {
        display: none;
      }

      .image-unavailable {
        color: var(--muted);
        font-size: 13px;
      }

      [hidden] {
        display: none !important;
      }

      @container reader-pane (max-width:700px) {
        article#content,
        body > .reader > main > pre#source {
          padding-right: 18px;
          padding-left: 18px;
        }
      }

      @media (max-width:700px) {
        .reader {
          grid-template-columns: minmax(0,1fr);
          grid-template-rows: auto minmax(0,1fr);
        }

        aside {
          max-height: 25vh;
          padding: 12px 18px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .reader[data-toc=hidden] {
          grid-template-rows: minmax(0,1fr);
        }

        body > header {
          padding-right: 8px;
          padding-left: 8px;
        }
      }

      @media (any-pointer: coarse) {
        body > header > .reader-actions > button {
          min-height: 44px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        main {
          scroll-behavior: auto;
        }

        body > header > .reader-actions > button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header aria-label="阅读操作">
      <span id="name">Markdown</span>
      <div class="reader-actions">
        <button id="toggle-toc" aria-controls="toc" aria-expanded="true">目录</button>
        <button id="toggle-source" aria-pressed="false">
          <span class="button-label">查看源码</span>
        </button>
        <button id="open-browser" disabled>在浏览器打开</button>
      </div>
    </header>
    <div class="reader" id="reader">
      <aside aria-label="文档目录">
        <strong>目录</strong>
        <nav id="toc"></nav>
      </aside>
      <main id="main">
        <p id="error" role="alert" hidden></p>
        <p id="status" role="status" hidden></p>
        <article id="content" class="markdown-preview crossnote"></article>
        <pre id="source" aria-label="Markdown 源码" hidden></pre>
        <div id="detail"></div>
      </main>
    </div>
    <script>/* BUNDLED_HOST_BRIDGE */</script>
    <script>/* BUNDLED_MERMAID */</script>
    <script>/* BUNDLED_APPEARANCE */</script>
    <script>/* BUNDLED_READER */</script>
    <script>
      // Capture the shell before document headings can reuse its IDs.
      const nodes = new Map(
        Array.from(document.querySelectorAll('[id]'), node => [node.id, node])
      );
      initializeReader({ nodes, host: window.markdownHost, mermaid });
    </script>
  </body>
</html>
