<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown Preview</title>
    <style>
      /* BUNDLED_STYLES */

      :root {
        color-scheme: light dark;
        --paper: #fff;
        --side: #f6f7f9;
        --ink: #243042;
        --muted: #677383;
        --line: #dfe3e9;
        --accent: #235bcc;
        --error: #a63b2c;
        font: 15px/1.75 system-ui,-apple-system,sans-serif;
      }

      :root[data-theme=dark] {
        color-scheme: dark;
        --paper: #171a20;
        --side: #20242b;
        --ink: #e2e8f0;
        --muted: #aab4c2;
        --line: #383f49;
        --accent: #9cbbff;
        --error: #f6a99b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
      }

      body {
        display: grid;
        grid-template-rows: auto minmax(0,1fr);
        overflow: hidden;
      }

      body > header {
        display: flex;
        flex-wrap: wrap;
        min-width: 0;
        gap: 16px;
        align-items: center;
        padding: 6px 20px;
        border-bottom: 1px solid var(--line);
      }

      body > header > #name {
        flex: 1 1 auto;
        min-width: 0;
        max-width: 100%;
        white-space: normal;
        overflow-wrap: anywhere;
        font-size: 15px;
        font-weight: 600;
      }

      body > header > .reader-actions {
        display: flex;
        flex: 0 1 auto;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        max-width: 100%;
      }

      body > header > .reader-actions > button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 32px;
        flex-shrink: 0;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        border-radius: 6px;
        padding: 0 10px;
        cursor: pointer;
      }

      body > header > .reader-actions > button:hover,
      body > header > .reader-actions > button[aria-pressed=true] {
        background: var(--side);
        color: var(--ink);
      }

      body > header > .reader-actions > button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      body > header > .reader-actions > button:disabled {
        opacity: .55;
        cursor: default;
      }

      body > header > .reader-actions > button[hidden] {
        display: none;
      }

      .reader {
        display: grid;
        grid-template-columns: 220px minmax(0,1fr);
        min-height: 0;
      }

      .reader[data-toc=hidden] {
        grid-template-columns: minmax(0,1fr);
      }

      .reader[data-toc=hidden] aside {
        display: none;
      }

      aside {
        background: var(--side);
        overflow: auto;
        padding: 20px 16px;
        border-right: 1px solid var(--line);
        font-size: 13px;
      }

      aside strong {
        font-size: 12px;
        color: var(--muted);
      }

      body > .reader > aside > #toc a {
        color: var(--muted);
        text-decoration: none;
      }

      body > .reader > aside > #toc a:hover {
        color: var(--accent);
      }

      main {
        overflow: auto;
        min-width: 0;
        scroll-behavior: smooth;
      }

      article,
      body > .reader > main > pre#source {
        max-width: 980px;
        margin: 0 auto;
        padding: 16px 38px 90px;
        overflow-wrap: anywhere;
      }

      body > .reader > main > pre#source {
        white-space: pre-wrap;
        font: 14px/1.8 ui-monospace,monospace;
      }

      body > .reader > main > pre#source > span {
        display: block;
        min-height: 1.8em;
      }

      [hidden] {
        display: none !important;
      }

      article h1,
      article h2,
      article h3,
      article h4,
      article h5,
      article h6 {
        line-height: 1.35;
        margin: 1.5em 0 .7em;
        scroll-margin-top: 24px;
      }

      article h1 {
        font-size: 2em;
      }

      article h2 {
        font-size: 1.5em;
        border-bottom: 1px solid var(--line);
        padding-bottom: .3em;
      }

      article h1:first-child {
        margin-top: 0;
      }

      article a {
        color: var(--accent);
      }

      article p {
        margin: 0 0 1em;
      }

      article img {
        max-width: 100%;
      }

      article blockquote {
        margin: 0 0 1em;
        padding: 0 1em;
        border-left: 4px solid var(--line);
        color: var(--muted);
      }

      article table {
        border-collapse: collapse;
        display: block;
        max-width: 100%;
        overflow: auto;
        margin: 1em 0;
      }

      article td,
      article th {
        padding: 8px 14px;
        border: 1px solid var(--line);
      }

      article th {
        background: var(--side);
      }

      article code {
        font: .9em ui-monospace,monospace;
        background: var(--side);
        padding: 2px 5px;
        border-radius: 4px;
      }

      article pre {
        padding: 16px;
        overflow: auto;
        background: var(--side);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      article pre code {
        padding: 0;
        white-space: pre;
        background: none;
        text-shadow: none;
        color: inherit;
      }

      article .mermaid {
        padding: 16px 0;
        text-align: center;
        overflow: auto;
      }

      article .mermaid svg {
        max-width: 100%;
        height: auto;
      }

      article .katex-display {
        overflow: auto hidden;
        padding: 6px 0;
      }

      .image-unavailable {
        color: var(--muted);
        font-size: 13px;
      }

      body > .reader > main > p#error {
        margin: 12px 20px;
        color: #c34837;
        white-space: pre-wrap;
      }

      body > .reader > main > p#status {
        margin: 12px 20px;
        color: var(--error);
        font-size: 13px;
        white-space: pre-wrap;
      }

      body > .reader > main > div#detail {
        padding: 10px 20px;
        color: var(--muted);
        font-size: 11px;
        border-top: 1px solid var(--line);
      }

      :root[data-theme=dark] .token {
        background: none;
        text-shadow: none;
        color: var(--ink);
      }

      :root[data-theme=dark] .token.keyword {
        color: #c4a5ff;
      }

      :root[data-theme=dark] .token.string {
        color: #8ed7b4;
      }

      :root[data-theme=dark] .token.function {
        color: #a5c9ff;
      }

      article pre[class*=language-],
      article code[class*=language-] {
        background: var(--side);
        color: var(--ink);
        text-shadow: none;
      }

      @media (max-width:700px) {
        .reader {
          grid-template-columns: minmax(0,1fr);
          grid-template-rows: auto minmax(0,1fr);
        }

        aside {
          max-height: 28vh;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding: 12px 18px;
        }

        .reader[data-toc=hidden] {
          grid-template-rows: minmax(0,1fr);
        }

        article,
        body > .reader > main > pre#source {
          padding: 16px 20px 70px;
        }

        body > header {
          padding: 6px 14px;
          gap: 12px;
        }

        body > header > #name {
          font-size: 14px;
        }
      }

      @media (any-pointer: coarse) {
        body > header > .reader-actions > button {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <header aria-label="阅读操作">
      <span id="name">Markdown</span>
      <div class="reader-actions">
        <button id="toggle-toc" aria-controls="toc" aria-expanded="true">目录</button>
        <button id="toggle-source" aria-pressed="false">
          <span class="button-label">查看源码</span>
        </button>
        <button id="open-browser" disabled>在浏览器打开</button>
      </div>
    </header>
    <div class="reader" id="reader">
      <aside aria-label="文档目录">
        <strong>目录</strong>
        <nav id="toc"></nav>
      </aside>
      <main id="main">
        <p id="error" role="alert" hidden></p>
        <p id="status" role="status" hidden></p>
        <article id="content" class="markdown-preview crossnote"></article>
        <pre id="source" aria-label="Markdown 源码" hidden></pre>
        <div id="detail"></div>
      </main>
    </div>
    <script>/* BUNDLED_HOST_BRIDGE */</script>
    <script>/* BUNDLED_MERMAID */</script>
    <script>/* BUNDLED_READER */</script>
    <script>
      // Capture the shell before document headings can reuse its IDs.
      const nodes = new Map(
        Array.from(document.querySelectorAll('[id]'), node => [node.id, node])
      );
      initializeReader({ nodes, host: window.markdownHost, mermaid });
    </script>
  </body>
</html>
